name: CI Build, Test, and Electron Packaging

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Angular)
        env:
          CI: true
        run: npm run test

  package-macos:
    name: Package MacOS
    runs-on: macos-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Electron make
        run: npm run make

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          name: marka-installer-macos.dmg
          if-no-files-found: error
          path: out/make/**/*.dmg

      - name: Upload Portable App
        uses: actions/upload-artifact@v7
        with:
          name: marka-portable-macos.zip
          if-no-files-found: error
          path: out/make/**/*.zip

  package-ubuntu:
    name: Package Ubuntu
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Electron make
        run: npm run make

      - name: Upload DEB Installer
        uses: actions/upload-artifact@v7
        with:
          name: marka-installer-ubuntu.deb
          if-no-files-found: error
          path: out/make/**/*.deb

      - name: Upload RPM Installer
        uses: actions/upload-artifact@v7
        with:
          name: marka-installer-ubuntu.rpm
          if-no-files-found: error
          path: out/make/**/*.rpm

      - name: Upload Portable App
        uses: actions/upload-artifact@v7
        with:
          name: marka-portable-ubuntu.tar.gz
          if-no-files-found: error
          path: out/make/**/*.tar.gz

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Install dependencies
        run: npm ci

      - name: Electron make
        run: npm run make

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          name: marka-installer-windows.msi
          if-no-files-found: error
          path: out/make/**/*.msi

      - name: Upload Portable App
        uses: actions/upload-artifact@v7
        with:
          name: marka-portable-macos.zip
          if-no-files-found: error
          path: out/make/**/*.zip
